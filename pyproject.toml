[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marcnosc-featplat_jd355"
version = "0.1.0"
description = "按结构键把条目聚类，标出特征平台工程师·分块策略对召回的影响上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "marcnosc" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://marcnosc.github.io"
Repository = "https://github.com/marcnosc/featplat_jd355"
Issues = "https://github.com/marcnosc/featplat_jd355/issues"

[project.scripts]
featplat_jd355 = "featplat_jd355:main"

[tool.setuptools]
py-modules = ["featplat_jd355"]
